<title>Ossa Latina</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,600&family=IBM+Plex+Sans:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#E7EBEE; --surface:#F5F8F9; --raised:#FFFFFF;
  --ink:#131A21; --ink2:#55626D; --ink3:#87949F;
  --line:#C7D0D7; --line-soft:#DDE4E9;
  --accent:#27446F; --accent-soft:#DFE7F1; --accent-ink:#27446F;
  --stress:#A3232E; --stress-soft:#F3DEDF;
  --bone:#E4D9C3; --bone-line:#CDBD9C; --bone-ink:#57492C;
  --ok:#2C6A4E; --ok-soft:#DCEBE2;
  --bad:#A3232E; --bad-soft:#F3DEDF;
  --shadow:0 1px 2px rgba(19,26,33,.06), 0 6px 18px -10px rgba(19,26,33,.22);
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
  --ground:#0F151A; --surface:#171F26; --raised:#1D272F;
  --ink:#DFE6EC; --ink2:#9BA8B4; --ink3:#6C7A88;
  --line:#2C3742; --line-soft:#232E38;
  --accent:#90B4E3; --accent-soft:#1E2E3E; --accent-ink:#A9C6EC;
  --stress:#E7818B; --stress-soft:#382125;
  --bone:#2E2820; --bone-line:#4A4032; --bone-ink:#D8C9A6;
  --ok:#7FC49E; --ok-soft:#1B2C24;
  --bad:#E7818B; --bad-soft:#382125;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
}
:root[data-theme="dark"]{
  --ground:#0F151A; --surface:#171F26; --raised:#1D272F;
  --ink:#DFE6EC; --ink2:#9BA8B4; --ink3:#6C7A88;
  --line:#2C3742; --line-soft:#232E38;
  --accent:#90B4E3; --accent-soft:#1E2E3E; --accent-ink:#A9C6EC;
  --stress:#E7818B; --stress-soft:#382125;
  --bone:#2E2820; --bone-line:#4A4032; --bone-ink:#D8C9A6;
  --ok:#7FC49E; --ok-soft:#1B2C24;
  --bad:#E7818B; --bad-soft:#382125;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ── шапка ─────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--ground) 88%, transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:4px}
.brand b{font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:.01em}
.brand b i{font-style:normal;color:var(--stress)}
.brand span{font-size:11px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px}
.tabs button{padding:5px 13px;border-radius:6px;font-size:13.5px;font-weight:450;color:var(--ink2)}
.tabs button[aria-selected="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
.search{flex:1;min-width:170px;max-width:340px;margin-left:auto;position:relative}
.search input{width:100%;padding:7px 11px 7px 32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
.search input::placeholder{color:var(--ink3)}
.search svg{position:absolute;left:10px;top:9px;color:var(--ink3)}
.voice-pick{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.voice-pick select{font:inherit;font-size:12.5px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}

/* ── каркас ────────────────────────────────────────── */
main{display:grid;grid-template-columns:246px minmax(0,1fr);gap:26px;max-width:1180px;margin:0 auto;padding:22px 20px 80px}
aside{position:sticky;top:74px;align-self:start;display:flex;flex-direction:column;gap:18px}
.side-h{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:7px;font-weight:500}
.sec-list{display:flex;flex-direction:column;gap:1px}
.sec-list button{display:flex;justify-content:space-between;align-items:baseline;gap:8px;text-align:left;padding:6px 9px;border-radius:6px;font-size:13.5px;color:var(--ink2)}
.sec-list button:hover{background:var(--surface)}
.sec-group{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin:10px 0 2px;padding:5px 9px;border-radius:6px;font-weight:600;text-align:left}
.sec-group:hover{background:var(--surface);color:var(--ink2)}
.sec-group span:first-child{display:flex;align-items:center;gap:6px}
.sec-group span:first-child::before{content:"";width:0;height:0;border:4px solid transparent;border-left-color:currentColor;margin-left:1px;transition:transform .15s}
.sec-group[aria-expanded="true"] span:first-child::before{transform:rotate(90deg) translateX(1px)}
.sec-group .n{font-family:var(--mono);font-size:10.5px;letter-spacing:0;color:var(--ink3);font-variant-numeric:tabular-nums}
.sec-sub{display:flex;flex-direction:column;gap:1px;padding-left:11px;border-left:1px solid var(--line-soft);margin-left:9px}
.sec-list button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.sec-list .n{font-family:var(--mono);font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.sec-list button[aria-current="true"] .n{color:var(--accent-ink)}

/* ── прогресс ──────────────────────────────────────── */
.prog{border-top:1px solid var(--line-soft);padding-top:14px}
.prog-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line-soft);margin-bottom:9px}
.prog-bar i{display:block;height:100%}
.prog-legend{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.prog-legend div{display:flex;align-items:center;gap:6px}
.prog-legend b{font-family:var(--mono);font-weight:500;margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink)}
.dot{width:7px;height:7px;border-radius:2px;flex:none}

/* ── карточка термина ──────────────────────────────── */
.count{font-size:12.5px;color:var(--ink3);margin-bottom:12px;font-variant-numeric:tabular-nums}
.terms{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term{background:var(--surface)}
.term-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 14px}
.term-head:hover{background:var(--raised)}
.term[data-open="1"]{background:var(--raised)}
.head-main{display:grid;gap:2px;text-align:left;min-width:0}
.la{font-family:var(--serif);font-size:19.5px;font-style:italic;line-height:1.25;letter-spacing:.005em}
.tr{font-size:13px;color:var(--ink2)}
.term-tools{display:flex;align-items:center;gap:6px}
.icon-btn{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink2);flex:none}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.icon-btn.rec{border-color:var(--stress);color:var(--stress)}
.icon-btn[data-on="1"]{background:var(--stress);border-color:var(--stress);color:#fff;animation:pulse 1.3s infinite}
@keyframes pulse{50%{opacity:.55}}
.has-rec{position:relative}
.has-rec::after{content:"";position:absolute;right:-1px;top:-1px;width:7px;height:7px;border-radius:50%;background:var(--stress);border:1.5px solid var(--raised)}

/* ── просодия ──────────────────────────────────────── */
.body{padding:2px 14px 16px;display:grid;gap:13px}
.scan{background:var(--bone);border:1px solid var(--bone-line);border-radius:8px;padding:13px 15px 11px;overflow-x:auto}
.scan-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:0 3px}
.word{display:flex;align-items:flex-end;margin-right:15px}
.syl{display:flex;flex-direction:column;align-items:center;padding:0 4px}
.mark{font-family:var(--mono);font-size:11px;line-height:1;height:13px;color:var(--bone-ink);opacity:.65}
.syl-t{font-family:var(--serif);font-size:20px;line-height:1.2;color:var(--bone-ink)}
.syl.on .syl-t{color:var(--stress);font-weight:600;border-bottom:2px solid var(--stress);padding-bottom:1px}
.syl.on .mark{color:var(--stress);opacity:1}
.sep{font-family:var(--serif);font-size:17px;color:var(--bone-ink);opacity:.35;align-self:flex-end;padding-bottom:2px}
.say{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;font-size:16.5px;letter-spacing:.01em}
.say .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.say b{font-weight:600;color:var(--stress)}
.slow{margin-left:auto;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);border-bottom:1px dotted var(--line)}
.slow:hover{color:var(--accent-ink);border-color:var(--accent)}
.bone-btn{display:inline-flex;align-items:center;gap:8px;align-self:start;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13.5px;color:var(--accent-ink);font-weight:500}
.bone-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
/* ── атлас скелета ─────────────────────────────────── */
.atlas{position:relative;height:min(72vh,620px);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:radial-gradient(115% 85% at 50% -10%, var(--surface), var(--ground) 72%);touch-action:none;cursor:grab}
.atlas:active{cursor:grabbing}
.atlas canvas{display:block}
.atlas.busy{cursor:progress}
.atlas-top{position:absolute;left:11px;top:11px;right:11px;display:flex;gap:9px;align-items:flex-start;pointer-events:none}
.atlas-card{background:color-mix(in srgb,var(--raised) 88%,transparent);backdrop-filter:blur(7px);
  border:1px solid var(--line-soft);border-radius:9px;padding:7px 12px;box-shadow:var(--shadow);pointer-events:auto;max-width:60%}
.atlas-la{font-family:var(--serif);font-style:italic;font-size:17.5px;line-height:1.2}
.atlas-ru{font-size:12px;color:var(--ink2);margin-top:1px}
.atlas-ru.big{font-size:16px;color:var(--ink);font-weight:500}
.atlas-back{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;
  background:color-mix(in srgb,var(--raised) 88%,transparent);backdrop-filter:blur(7px);border:1px solid var(--line-soft);
  box-shadow:var(--shadow);font-size:13px;color:var(--ink2);pointer-events:auto;white-space:nowrap}
.atlas-back:hover{color:var(--ink);border-color:var(--line)}
.atlas-foot{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:baseline;padding:20px 13px 9px;
  font-size:11.5px;color:var(--ink3);pointer-events:none;
  background:linear-gradient(0deg,color-mix(in srgb,var(--ground) 80%,transparent),transparent)}
.atlas-tip{position:absolute;z-index:3;padding:4px 9px;border-radius:7px;background:var(--ink);color:var(--ground);
  font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,-160%);transition:opacity .13s}
.atlas-tip.on{opacity:.92}
.stage-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3);font-size:13.5px;text-align:center;padding:0 24px}
.struct-list{display:flex;flex-direction:column;gap:1px}
.struct-list button{display:flex;flex-direction:column;gap:1px;text-align:left;padding:6px 9px;border-radius:6px}
.struct-list button:hover{background:var(--surface)}
.struct-list button[aria-current="true"]{background:var(--accent-soft)}
.struct-list .sl{font-family:var(--serif);font-style:italic;font-size:14.5px;line-height:1.25;color:var(--ink)}
.struct-list button[aria-current="true"] .sl{color:var(--accent-ink)}
.struct-list .sr{font-size:12px;color:var(--ink2)}
.struct-list .nodot{color:var(--ink3)}
.side-note{font-size:12.5px;color:var(--ink3);line-height:1.5;max-width:34ch}
.side-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--accent-ink);padding:4px 0}
.credit{margin-left:auto;opacity:.75}
.note{margin:0;font-size:14px;line-height:1.6;color:var(--ink2);max-width:64ch;border-left:3px solid var(--bone-line);padding-left:12px}
.rule{display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--accent);border-radius:0 7px 7px 0;padding:10px 13px}
.rule .rn{font-family:var(--mono);font-size:12px;color:var(--accent-ink);white-space:nowrap;font-weight:500;padding-top:1px}
.rule p{margin:0;font-size:13.5px;color:var(--ink2);max-width:62ch}
.rec-row{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink3);flex-wrap:wrap}
.mic-err{flex-basis:100%;color:var(--stress);font-size:12.5px;line-height:1.45;max-width:62ch}
.rec-row label{cursor:pointer}
.rec-row button.link{font-size:12.5px;color:var(--accent-ink);text-decoration:underline;text-underline-offset:2px}

/* ── тренировка ────────────────────────────────────── */
.drill-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:20px;font-size:13px;color:var(--ink2);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ground);font-weight:500}
.score{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.score b{color:var(--ok)} .score i{color:var(--bad);font-style:normal}
.card{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:26px 24px;box-shadow:var(--shadow);min-height:340px;display:flex;flex-direction:column;gap:20px}
.ask{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.quiz-term{font-family:var(--serif);font-size:34px;font-style:italic;line-height:1.15;text-wrap:balance}
.quiz-ru{font-size:26px;line-height:1.25;font-weight:450;text-wrap:balance}
.opts{display:grid;gap:7px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.opt{text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:15px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft);font-weight:500}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt em{font-family:var(--serif);font-style:italic;font-size:17px}
.syl-pick{display:flex;flex-wrap:wrap;gap:0 18px}
.syl-btn{font-family:var(--serif);font-size:30px;padding:4px 10px 2px;border-bottom:2px solid var(--line);color:var(--ink)}
.syl-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent-ink)}
.syl-btn:disabled{cursor:default}
.syl-btn.right{color:var(--ok);border-color:var(--ok);font-weight:600}
.syl-btn.wrong{color:var(--bad);border-color:var(--bad);text-decoration:line-through}
.verdict{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.next{margin-top:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{padding:9px 20px;border-radius:8px;background:var(--accent);color:var(--ground);font-weight:500;font-size:14.5px}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
.hint{font-size:12.5px;color:var(--ink3)}
.big-play{display:flex;align-items:center;gap:13px;padding:18px;border:1px dashed var(--line);border-radius:10px;background:var(--surface)}
.big-play button{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--ground);display:grid;place-items:center;flex:none}

/* ── правила ───────────────────────────────────────── */
.rules-wrap{display:grid;gap:22px;max-width:760px}
.rules-wrap h2{font-family:var(--serif);font-size:24px;font-weight:600;margin:0 0 4px}
.rules-wrap h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:0 0 9px;font-weight:500}
.rule-grid{display:grid;gap:1px;background:var(--line-soft);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rule-grid > div{background:var(--surface);padding:11px 14px;display:grid;grid-template-columns:130px minmax(0,1fr);gap:14px;align-items:baseline}
.rule-grid code{font-family:var(--mono);font-size:13px;color:var(--accent-ink);background:none}
.rule-grid p{margin:0;font-size:13.5px;color:var(--ink2)}
.rule-grid em{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink)}
.lead{font-size:14.5px;color:var(--ink2);max-width:65ch;margin:0 0 14px}
.empty{padding:40px 0;text-align:center;color:var(--ink3);font-size:14px}

@media (max-width:860px){
  main{grid-template-columns:minmax(0,1fr);gap:16px;padding:14px 14px 60px}
  aside{position:static;flex-direction:column}
  .sec-list{max-height:46vh;overflow-y:auto;scrollbar-width:thin}
  .sec-list > button:not(.sec-group){border:1px solid var(--line);border-radius:8px;padding:7px 11px;margin-bottom:2px}
  .sec-sub button{padding:7px 9px}
  .sec-group{margin:12px 0 3px}
  .prog{border-top:none;padding-top:0}
  .brand span{display:none}
  .search{margin-left:0;max-width:none;order:3;width:100%}
  .quiz-term{font-size:27px} .quiz-ru{font-size:21px}
  .card{padding:18px 16px}
  main.atlas-on #stage{order:1}
  main.atlas-on aside{order:2}
  .atlas{height:56vh}
  .struct-list{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:thin}
  .struct-list button{flex:none;white-space:nowrap;border:1px solid var(--line);border-radius:10px;padding:5px 11px}
  .struct-list button[aria-current="true"]{border-color:var(--accent)}
  .side-note{max-width:none}
}
</style>

<header class="top">
  <div class="brand"><b>os<i>·</i>sa</b><span>ударение в остеологии</span></div>
  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-v="ref" aria-selected="true">Справочник</button>
    <button role="tab" data-v="drill" aria-selected="false">Тренировка</button>
    <button role="tab" data-v="atlas" aria-selected="false">Скелет</button>
    <button role="tab" data-v="rules" aria-selected="false">Правила</button>
  </nav>
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
    <input id="q" type="search" placeholder="Поиск: латынь или перевод" autocomplete="off">
  </div>
</header>

<main>
  <aside id="side"></aside>
  <div id="stage"></div>
</main>

<script src="terms.js"></script>
<script src="audio.js"></script>
<script src="bones.js"></script>
<script>
"use strict";
const $ = (s, r) => (r || document).querySelector(s);
const NFD = s => s.normalize("NFD");
const bare = s => NFD(s).replace(/[\u0304\u0306]/g, "").normalize("NFC");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const VOW = /[аеёиоуыэюя]/;

/* ── модель ────────────────────────────────────────── */
function accent(s) { const m = s.match(VOW); return m ? s.slice(0, m.index + 1) + "\u0301" + s.slice(m.index + 1) : s; }

const DATA = TERMS.map(([laRaw, ruRaw, tr, rule, sec, note]) => {
  const lw = laRaw.split(" "), rw = ruRaw.split(" "), syls = [];
  lw.forEach((w, wi) => w.split("·").forEach((s, si) => syls.push({
    la: s, ru: rw[wi].split("·")[si], w: wi,
    stress: s !== s.toLowerCase(),
    long: /\u0304/.test(NFD(s)), short: /\u0306/.test(NFD(s))
  })));
  let say = "", cw = 0;
  syls.forEach(s => { if (s.w !== cw) { say += " "; cw = s.w; } say += s.stress ? accent(s.ru.toLowerCase()) : s.ru.toLowerCase(); });
  const la = bare(laRaw.replace(/·/g, "")).toLowerCase();
  return { id: la.replace(/\s+/g, "-"), la, tr, rule, sec, syls, say, note,
           single: syls.filter(s => s.stress).length === 1,
           hay: (la + " " + tr).toLowerCase() };
});
const BY_ID = Object.fromEntries(DATA.map(t => [t.id, t]));
const BOX_DAYS = [0, 1, 3, 7, 21];

const state = {
  view: "ref", sec: SECTIONS[0][0], q: "", open: "tuberculum", grp: null,
  atlas: { bones: null, side: "r", label: null, term: null },
  mode: "stress", scope: "all",
  cur: null, answered: null, score: { r: 0, w: 0 },
  progress: (() => { try { return JSON.parse(localStorage.getItem("ossa.progress") || "{}"); } catch (e) { return {}; } })(),
  recs: (() => { try { return JSON.parse(localStorage.getItem("ossa.recs") || "{}"); } catch (e) { return {}; } })()
};

/* ── платформа: db + assets + локальное аудио ──────── */
const idb = () => new Promise(res => {
  const r = indexedDB.open("ossa", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("audio");
  r.onsuccess = () => res(r.result); r.onerror = () => res(null);
});
async function idbPut(k, v) { const d = await idb(); if (!d) return; d.transaction("audio", "readwrite").objectStore("audio").put(v, k); }
async function idbGet(k) {
  const d = await idb(); if (!d) return null;
  return new Promise(res => { const r = d.transaction("audio").objectStore("audio").get(k); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); });
}
const save = () => {                                  // прогресс и записи живут в браузере посетителя
  try {
    localStorage.setItem("ossa.progress", JSON.stringify(state.progress));
    localStorage.setItem("ossa.recs", JSON.stringify(state.recs));
  } catch (e) {}
};

/* ── речь ──────────────────────────────────────────── */
let VOICES = [];
const loadVoices = () => { try { VOICES = speechSynthesis.getVoices() || []; } catch (e) {} };
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
const voiceFor = p => VOICES.find(v => v.lang.replace("_", "-").toLowerCase().indexOf(p) === 0);
/* Звук. Основной путь — отдельный файл на термин: он играется целиком,
   без перемотки и без декодирования, поэтому надёжен на телефонах. Спрайт
   (один файл на весь словарь) остаётся запасным — им пользуется версия,
   где отдельных файлов нет. Всё стартует синхронно, внутри жеста. */
const AC = window.AudioContext || window.webkitAudioContext;
const HAS_SPRITE = typeof SPRITE === "object" && SPRITE;
const CLIP_DIR = "audio/";
let clips = null, clipEl = null, actx = null, sprBuf = null, sprRaw = null,
    node = null, decoding = null, player = null, el = null, stopAt = null;

fetch(CLIP_DIR + "index.json").then(r => r.ok ? r.json() : null)
  .then(list => { clips = Array.isArray(list) ? new Set(list) : false; if (!clips) primeSprite(); })
  .catch(() => { clips = false; primeSprite(); });

function primeSprite() {
  if (!HAS_SPRITE || !AC) return;
  fetch("ossa.mp4").then(r => r.arrayBuffer()).then(b => { sprRaw = b; buffer(); }).catch(() => {});
}
function ctx() {
  if (!actx && AC) { try { actx = new AC(); } catch (e) { return null; } }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function buffer() {
  if (sprBuf || decoding || !sprRaw) return;
  const c = ctx(); if (!c) return;
  decoding = new Promise((res, rej) => {
    let done = false;
    const ok = b => { if (!done) { done = true; sprBuf = b; res(b); } };
    const no = e => { if (!done) { done = true; decoding = null; rej(e); } };
    setTimeout(() => no(new Error("decode timeout")), 12000);
    let p; try { p = c.decodeAudioData(sprRaw.slice(0), ok, no); } catch (e) { return no(e); }
    if (p && p.then) p.then(ok, no);                  // Safari умеет только колбэки
  }).catch(() => null);
}
function stopAll() {
  if (node) { try { node.stop(); } catch (e) {} node = null; }
  if (player) { player.pause(); player = null; }
  if (clipEl) clipEl.pause();
  if (el) { clearTimeout(stopAt); el.pause(); }
  if (window.speechSynthesis) speechSynthesis.cancel();
}
function playClip(id, rate) {
  if (!clips || !clips.has(id)) return false;
  if (!clipEl) {
    clipEl = new Audio();
    clipEl.addEventListener("error", () => { clips = false; primeSprite(); });
  }
  clipEl.src = CLIP_DIR + encodeURIComponent(id) + ".mp4";
  clipEl.playbackRate = rate;
  const p = clipEl.play();
  if (p && p.catch) p.catch(() => {});
  return true;
}
function playExact(seg, rate) {
  const c = ctx(); if (!c || !sprBuf) return false;
  node = c.createBufferSource();
  node.buffer = sprBuf; node.playbackRate.value = rate;
  node.connect(c.destination);
  node.start(0, seg[0], seg[1] + .04);
  return true;
}
function playRough(seg, rate) {
  if (!el) { el = new Audio("ossa.mp4"); el.preload = "auto"; }
  const go = () => {
    clearTimeout(stopAt);
    el.playbackRate = rate;
    try { el.currentTime = Math.max(0, seg[0] - .02); } catch (e) { return; }
    el.play().catch(() => {});
    stopAt = setTimeout(() => el.pause(), (seg[1] / rate) * 1000 + 140);
  };
  if (el.readyState >= 1) go(); else el.addEventListener("loadedmetadata", go, { once: true });
  return true;
}
function speakBrowser(t, slow) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(t.say);
  u.voice = voiceFor("ru") || null; u.lang = "ru-RU";
  u.rate = slow ? .55 : .8;
  speechSynthesis.speak(u);
}
function say(t, slow) {                               // всегда вызывается прямо из обработчика нажатия
  const rate = slow ? .75 : 1;
  stopAll();
  if (state.recs[t.id]) {                             // своя запись важнее эталона
    idbGet(t.id).then(blob => {
      if (!blob) return;
      player = new Audio(URL.createObjectURL(blob));
      player.playbackRate = rate; player.play().catch(() => {});
    });
    return;
  }
  if (playClip(t.id, rate)) return;
  const seg = HAS_SPRITE && SPRITE[t.id];
  if (seg) {
    if (sprBuf) { if (playExact(seg, rate)) return; }
    else { buffer(); if (playRough(seg, rate)) return; }
  }
  speakBrowser(t, slow);
}

/* ── иконки ────────────────────────────────────────── */
const ICON = {

  bigplay: '<svg width="20" height="20" viewBox="0 0 14 14" fill="currentColor"><path d="M4 2.4v9.2l7.5-4.6z"/></svg>',
  mic: '<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="1.4" width="4" height="7" rx="2"/><path d="M2.8 6.6a4.2 4.2 0 0 0 8.4 0M7 10.8v1.8"/></svg>',
  cube: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.6 14 5v6l-6 3.4L2 11V5z"/><path d="M2 5l6 3.4L14 5M8 8.4v6"/></svg>',
  upload: '<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 9.6V2.2M4.2 5l2.8-2.8L9.8 5M2.2 9.4v1.6a1.4 1.4 0 0 0 1.4 1.4h6.8a1.4 1.4 0 0 0 1.4-1.4V9.4"/></svg>',
  stop: '<svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor"><rect x="2" y="2" width="8" height="8" rx="1.5"/></svg>'
};

/* ── просодическая строка ──────────────────────────── */
function scanHTML(t, opts) {
  const o = opts || {}, words = [];
  t.syls.forEach(s => { (words[s.w] = words[s.w] || []).push(s); });
  const body = words.map(ws => '<span class="word">' + ws.map((s, i) => {
    const mark = o.blind ? "" : (s.long ? "‾" : s.short ? "˘" : "");
    const text = o.blind ? bare(s.la).toLowerCase() : s.la.toLowerCase();
    return (i ? '<span class="sep">·</span>' : "") +
      '<span class="syl' + (!o.blind && s.stress ? " on" : "") + '"><span class="mark">' + mark + '</span><span class="syl-t">' + esc(text) + "</span></span>";
  }).join("") + "</span>").join("");
  return '<div class="scan"><div class="scan-row">' + body + "</div></div>";
}
function sayHTML(t) {
  const words = [];
  t.syls.forEach(s => { (words[s.w] = words[s.w] || []).push(s); });
  const body = words.map(ws => ws.map((s, i) => (i ? '<span style="opacity:.3">·</span>' : "") +
    (s.stress ? "<b>" + esc(accent(s.ru.toLowerCase())) + "</b>" : esc(s.ru.toLowerCase()))).join("")).join(" ");
  return '<div class="say"><span class="lab">читается</span>' + body +
    '<button class="slow" data-act="say-slow">медленно</button></div>';
}
function noteHTML(t) {
  return t.note ? '<p class="note">' + esc(t.note) + "</p>" : "";
}
function ruleHTML(t) {
  const r = RULES[t.rule];
  return '<div class="rule"><span class="rn">' + esc(r[0]) + "</span><p>" + esc(r[1]) + "</p></div>";
}

/* ── справочник ────────────────────────────────────── */
function filtered() {
  const q = state.q.trim().toLowerCase();
  if (q) return DATA.filter(t => t.hay.indexOf(q) >= 0);
  return state.sec === "all" ? DATA : DATA.filter(t => t.sec === state.sec);
}
function termHTML(t) {
  const open = state.open === t.id, rec = state.recs[t.id];
  return '<article class="term" data-id="' + t.id + '" data-open="' + (open ? 1 : 0) + '">' +
    '<div class="term-head"><button class="head-main" data-act="open" aria-expanded="' + open + '">' +
      '<span class="la">' + esc(t.la) + '</span><span class="tr">' + esc(t.tr) + '</span></button>' +
      '<span class="term-tools">' +
        '<button class="icon-btn' + (rec ? " has-rec" : "") + '" data-act="say" title="Прослушать">' + ICON.play + '</button>' +
      '</span></div>' +
    (open ? '<div class="body">' + scanHTML(t) + sayHTML(t) + noteHTML(t) + ruleHTML(t) + boneRowHTML(t) + recRowHTML(t) + '</div>' : "") +
  "</article>";
}
function boneRowHTML(t) {
  const link = typeof TERM_3D === "object" && TERM_3D[t.id];
  if (!link) return "";
  const b = Array.isArray(link[0]) ? link[0] : [link[0]];
  const nm = b.length === 1 && BONE_NAMES[b[0]];
  return '<button class="bone-btn" data-act="show3d">' + ICON.cube +
    "Показать на скелете" + (nm ? " — " + esc(nm[1]) : "") + "</button>";
}
function recRowHTML(t) {
  const rec = state.recs[t.id];
  return '<div class="rec-row">' +
    '<button class="icon-btn rec" data-act="rec" title="Записать с микрофона">' + ICON.mic + '</button>' +
    '<label class="icon-btn rec" title="Загрузить аудиофайл">' + ICON.upload +
      '<input type="file" accept="audio/*" capture data-term="' + t.id + '" hidden></label>' +
    (rec ? '<span>Звучит ваша запись вместо синтеза</span><button class="link" data-act="unrec">удалить</button>'
         : '<span>Запишите или загрузите произношение — оно заменит синтезированный голос</span>') +
    (state.micErr === t.id ? '<span class="mic-err">Запись с микрофона недоступна: страница открыта внутри рамки claude.ai, и браузер блокирует микрофон независимо от ваших разрешений. Запишите на диктофон телефона и загрузите файл — вторая кнопка.</span>' : "") +
  "</div>";
}
function renderRef() {
  const list = filtered();
  const secName = state.q ? "найдено" : (SECTIONS.find(s => s[0] === state.sec) || [, "Все разделы"])[1];
  $("#stage").innerHTML = list.length
    ? '<div class="count">' + esc(secName) + ' · ' + list.length + ' ' + plural(list.length, "термин", "термина", "терминов") + '</div><div class="terms">' + list.map(termHTML).join("") + "</div>"
    : '<div class="empty">Ничего не нашлось. Попробуйте часть слова — «tuber», «отросток».</div>';
}
const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; };

/* ── боковая колонка ───────────────────────────────── */
function renderSide() {
  if (state.view === "rules") { $("#side").innerHTML = progHTML(); return; }
  const drill = state.view === "drill", cur = drill ? state.scope : state.sec;
  const counts = {}; DATA.forEach(t => counts[t.sec] = (counts[t.sec] || 0) + 1);
  const btn = (id, name, n) => '<button data-sec="' + id + '" aria-current="' + (cur === id) +
    '"><span>' + esc(name) + '</span><span class="n">' + n + "</span></button>";
  // разделов три десятка: показываем их группами и раскрываем по одной
  const groups = [];
  SECTIONS.forEach(s => {
    const g = s[3] || "";
    if (!groups.length || groups[groups.length - 1].g !== g) groups.push({ g, secs: [] });
    groups[groups.length - 1].secs.push(s);
  });
  // раскрыта группа, выбранная руками, иначе та, где лежит текущий раздел
  const home = (groups.find(x => x.g && x.secs.some(s => s[0] === cur)) || {}).g || null;
  const open = state.grp === null ? home : state.grp;
  let html = btn("all", drill ? "Всё сразу" : "Все разделы", DATA.length);
  groups.forEach(gr => {
    const n = gr.secs.reduce((a, s) => a + (counts[s[0]] || 0), 0);
    if (!gr.g) { html += gr.secs.map(s => btn(s[0], s[1], counts[s[0]] || 0)).join(""); return; }
    const on = open === gr.g;
    html += '<button class="sec-group" data-grp="' + esc(gr.g) + '" aria-expanded="' + on + '">' +
      '<span>' + esc(gr.g) + '</span><span class="n">' + n + "</span></button>" +
      '<div class="sec-sub"' + (on ? "" : " hidden") + ">" +
      gr.secs.map(s => btn(s[0], s[1], counts[s[0]] || 0)).join("") + "</div>";
  });
  $("#side").innerHTML = '<div><div class="side-h">' + (drill ? "Что тренируем" : "Разделы") +
    '</div><div class="sec-list">' + html + "</div></div>" + progHTML();
}
function progHTML() {
  let learned = 0, work = 0;
  DATA.forEach(t => { const p = state.progress[t.id]; if (!p) return; if (p.box >= 3) learned++; else work++; });
  const fresh = DATA.length - learned - work, pc = n => (n / DATA.length * 100).toFixed(2) + "%";
  return '<div class="prog"><div class="side-h">Прогресс</div>' +
    '<div class="prog-bar"><i style="width:' + pc(learned) + ';background:var(--ok)"></i><i style="width:' + pc(work) + ';background:var(--accent)"></i></div>' +
    '<div class="prog-legend">' +
      '<div><span class="dot" style="background:var(--ok)"></span>Закреплено<b>' + learned + "</b></div>" +
      '<div><span class="dot" style="background:var(--accent)"></span>В работе<b>' + work + "</b></div>" +
      '<div><span class="dot" style="background:var(--line)"></span>Не начато<b>' + fresh + "</b></div>" +
    "</div></div>";
}

/* ── тренировка ────────────────────────────────────── */
const MODES = [["stress", "Ударение"], ["la2ru", "Латынь → перевод"], ["ru2la", "Перевод → латынь"], ["audio", "На слух"]];
function pool() {
  let l = state.scope === "all" ? DATA : DATA.filter(t => t.sec === state.scope);
  return state.mode === "stress" ? l.filter(t => t.single) : l;
}
function makeOpts(t) {
  if (state.mode === "stress") return null;
  const near = shuffle(DATA.filter(x => x.sec === t.sec && x.id !== t.id && x.tr !== t.tr)).slice(0, 3);
  const far = shuffle(DATA.filter(x => x.id !== t.id && x.tr !== t.tr));
  while (near.length < 3) { const c = far.pop(); if (c && near.indexOf(c) < 0) near.push(c); }
  return shuffle(near.concat([t]));
}
function nextCard(first) {
  const list = pool();
  if (!list.length) { state.cur = null; return; }
  const now = Date.now(), due = [], fresh = [], rest = [];
  list.forEach(t => { const p = state.progress[t.id]; if (!p) fresh.push(t); else if (p.due <= now) due.push(t); else rest.push(t); });
  const queue = shuffle(due).concat(shuffle(fresh), shuffle(rest)).filter(t => !state.cur || t.id !== state.cur.id);
  state.cur = queue[0] || list[0];
  state.answered = null;
  state.opts = makeOpts(state.cur);
  if (!first && state.mode === "audio") say(state.cur);
}
function renderDrill() {
  if (!state.cur || (state.mode === "stress" && !state.cur.single)) nextCard(true);
  const t = state.cur, a = state.answered;
  let card;
  if (!t) card = '<div class="card"><div class="empty">В этом разделе нет слов для такого режима. Выберите другой раздел или режим.</div></div>';
  else {
    let q = "";
    if (state.mode === "stress") {
      q = '<div class="ask">Где ударение?</div>' + (a ? scanHTML(t) : '<div class="scan">' + sylPick(t) + "</div>") +
          '<div class="hint">' + esc(t.tr) + "</div>";
    } else if (state.mode === "la2ru") {
      q = '<div class="ask">Что это значит?</div><div class="quiz-term">' + esc(t.la) + "</div>" + optsHTML(x => x.tr);
    } else if (state.mode === "ru2la") {
      q = '<div class="ask">Как по-латински?</div><div class="quiz-ru">' + esc(t.tr) + "</div>" + optsHTML(x => "<em>" + esc(x.la) + "</em>");
    } else {
      q = '<div class="ask">Что вы слышите?</div><div class="big-play"><button data-act="say-cur" aria-label="Повторить">' + ICON.bigplay +
          '</button><button class="btn ghost" data-act="say-cur-slow">медленно</button><span class="hint">или клавиши 1–4</span></div>' + optsHTML(x => "<em>" + esc(x.la) + "</em>");
    }
    const after = a ? '<div class="verdict ' + (a.ok ? "ok" : "no") + '">' + (a.ok ? "Верно" : "Правильно: " + esc(t.la)) + "</div>" +
        (state.mode === "stress" ? sayHTML(t) + ruleHTML(t) : scanHTML(t) + sayHTML(t) + ruleHTML(t)) : "";
    card = '<div class="card">' + q + after +
      '<div class="next">' + (a ? '<button class="btn" data-act="next">Дальше →</button><button class="btn ghost" data-act="say-cur">' + ICON.play + " Повторить</button>" : '<span class="hint">Выберите вариант — можно клавишами 1–4</span>') + "</div></div>";
  }
  $("#stage").innerHTML =
    '<div class="drill-top"><div class="chips">' + MODES.map(m => '<button class="chip" data-mode="' + m[0] + '" aria-pressed="' + (state.mode === m[0]) + '">' + m[1] + "</button>").join("") + "</div>" +
    '<div class="score">верно <b>' + state.score.r + "</b> · ошибок <i>" + state.score.w + "</i></div></div>" + card;
}
function sylPick(t) {
  const words = []; t.syls.forEach(s => { (words[s.w] = words[s.w] || []).push(s); });
  let n = -1;
  return '<div class="syl-pick">' + words.map(ws => '<span class="word">' + ws.map((s, i) => {
    n++; return (i ? '<span class="sep">·</span>' : "") + '<button class="syl-btn" data-syl="' + n + '">' + esc(bare(s.la).toLowerCase()) + "</button>";
  }).join("") + "</span>").join("") + "</div>";
}
function optsHTML(fmt) {
  const a = state.answered;
  return '<div class="opts">' + state.opts.map((x, i) => {
    let cls = "";
    if (a) cls = x.id === state.cur.id ? " right" : (a.chosen === x.id ? " wrong" : "");
    return '<button class="opt' + cls + '" data-opt="' + x.id + '"' + (a ? " disabled" : "") + ">" + fmt(x) + "</button>";
  }).join("") + "</div>";
}
function answer(ok, chosen) {
  state.answered = { ok: ok, chosen: chosen };
  state.score[ok ? "r" : "w"]++;
  const p = state.progress[state.cur.id] || { box: 0 };
  p.box = ok ? Math.min(4, p.box + 1) : 0;
  p.due = Date.now() + BOX_DAYS[p.box] * 864e5;
  state.progress[state.cur.id] = p;
  if (state.mode !== "audio") say(state.cur);            // синхронно: иначе телефон сочтёт жест утерянным
  save(); render();
}

/* ── правила ───────────────────────────────────────── */
const READING = [
  ["c", "[ц] перед e, i, y, ae, oe · [к] в остальных случаях", "cervicalis — цервика́лис · caput — ка́пут"],
  ["s", "[з] между гласными и между гласной и m, n · иначе [с]", "nasalis — наза́лис · sinus — си́нус"],
  ["ti", "[ци] перед гласной · [ти] после s, t, x", "articulatio — артикуля́цио · ostium — о́стиум"],
  ["ae, oe", "[э] одним звуком", "vertebrae — вэ́ртэбрэ · coxae — ко́ксэ"],
  ["au, eu", "[ау], [эу] — дифтонг в один слог", "auris — а́урис · pneumaticus — пнэума́тикус"],
  ["qu", "[кв]", "squama — сква́ма · liquor — ли́квор"],
  ["ngu", "[нгв] перед гласной", "lingua — ли́нгва · unguis — у́нгвис"],
  ["ch, ph, rh, th", "[х], [ф], [р], [т]", "trochlea — тро́хлеа · phalanges — фаля́нгэс"],
  ["j", "[й]; ju, ja — [ю], [я]", "major — ма́йор · jugularis — югуля́рис"],

  ["x, z", "[кс], [з]", "axis — а́ксис · zygomaticus — зигома́тикус"]
];

/* ── запись эталона ────────────────────────────────── */
let mrec = null;
async function toggleRec(t, btn) {
  if (mrec && mrec.state === "recording") { mrec.stop(); return; }
  let stream;
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("no api");
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) { state.micErr = t.id; render(); return; }
  state.micErr = null;
  const chunks = [];
  mrec = new MediaRecorder(stream);
  mrec.ondataavailable = e => e.data.size && chunks.push(e.data);
  mrec.onstop = async () => {
    stream.getTracks().forEach(x => x.stop());
    const blob = new Blob(chunks, { type: mrec.mimeType || "audio/webm" });
    mrec = null;
    addRec(t, blob);
  };
  mrec.start();
  btn.dataset.on = "1"; btn.innerHTML = ICON.stop; btn.title = "Остановить запись";
}
async function addRec(t, blob) {
  if (blob.size > 8e6) { state.micErr = t.id; render(); return; }
  await idbPut(t.id, blob);
  state.recs[t.id] = { at: Date.now(), type: blob.type };
  save(); render();
}
document.addEventListener("change", e => {
  const inp = e.target.closest('input[type="file"][data-term]');
  if (inp && inp.files && inp.files[0]) addRec(BY_ID[inp.dataset.term], inp.files[0]);
});
async function dropRec(t) {
  delete state.recs[t.id];
  await idbPut(t.id, null);
  save(); render();
}

/* ── 3D: кость и точка структуры ───────────────────── */
/* ── атлас скелета ─────────────────────────────────────
   Весь скелет лежит одним мешем: 212 костей в общем буфере, номер кости
   хранится повершинно в атрибуте aSel, поэтому подсветка и изоляция —
   это правка одного массива, а не пересборка сцены. Подробная модель
   выбранной кости подгружается отдельным файлом и встаёт на то же место:
   координаты у скелета и у костей общие, мировые. */
const THREE_URL = "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
let threeReady = null, skel = null, boneFiles = null, AT = null;
const detailCache = {};

const isDark = () => document.documentElement.dataset.theme === "dark" ||
  (matchMedia("(prefers-color-scheme: dark)").matches &&
   document.documentElement.dataset.theme !== "light");

function loadThree() {
  if (window.THREE) return Promise.resolve();
  if (!threeReady) threeReady = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = THREE_URL; sc.onload = res; sc.onerror = rej;
    document.head.appendChild(sc);
  });
  return threeReady;
}

function loadSkeleton() {
  if (skel) return Promise.resolve(skel);
  return Promise.all([
    fetch(SKEL_META).then(r => r.json()),
    fetch(SKEL_BIN).then(r => r.arrayBuffer()),
    fetch(BONE_DIR + "index.json").then(r => r.json()).catch(() => ({}))
  ]).then(([meta, buf, files]) => { boneFiles = files; return (skel = decodeSkel(meta, buf)); });
}

/* Позиции лежат Int16-квантованными по общему габариту, индексы — локальные
   для каждой кости; собираем сквозной Uint32-индекс и нормали на лету. */
function decodeSkel(meta, buf) {
  const nv = meta.nv, nt = meta.nt, k = meta.span / 65535;
  const qp = new Uint16Array(buf, 0, nv * 3);
  const qi = new Uint16Array(buf, nv * 6, nt * 3);
  const pos = new Float32Array(nv * 3);
  for (let i = 0; i < nv; i++) {
    pos[i * 3]     = meta.lo[0] + qp[i * 3] * k;
    pos[i * 3 + 1] = meta.lo[1] + qp[i * 3 + 1] * k;
    pos[i * 3 + 2] = meta.lo[2] + qp[i * 3 + 2] * k;
  }
  const idx = new Uint32Array(nt * 3);
  const part = new Int32Array(nv);
  meta.parts.forEach((p, pi) => {
    const io = p.io * 3;
    for (let i = 0; i < p.nt * 3; i++) idx[io + i] = qi[io + i] + p.vo;
    for (let i = 0; i < p.nv; i++) part[p.vo + i] = pi;
  });
  const nor = new Float32Array(nv * 3);
  for (let i = 0; i < idx.length; i += 3) {
    const a = idx[i] * 3, b = idx[i + 1] * 3, c = idx[i + 2] * 3;
    const e1x = pos[b] - pos[a], e1y = pos[b + 1] - pos[a + 1], e1z = pos[b + 2] - pos[a + 2];
    const e2x = pos[c] - pos[a], e2y = pos[c + 1] - pos[a + 1], e2z = pos[c + 2] - pos[a + 2];
    const nx = e1y * e2z - e1z * e2y, ny = e1z * e2x - e1x * e2z, nz = e1x * e2y - e1y * e2x;
    nor[a] += nx; nor[a + 1] += ny; nor[a + 2] += nz;
    nor[b] += nx; nor[b + 1] += ny; nor[b + 2] += nz;
    nor[c] += nx; nor[c + 1] += ny; nor[c + 2] += nz;
  }
  // границы треугольников по костям — по ним ищем кость под курсором
  const tri = meta.parts.map(p => p.io);
  return { meta, pos, idx, nor, part, tri, sel: new Float32Array(nv) };
}

/* Подробная модель кости: тот же мировой масштаб, плюс точки структур */
function loadDetail(mesh) {
  if (detailCache[mesh]) return Promise.resolve(detailCache[mesh]);
  const f = boneFiles && boneFiles[mesh];
  if (!f) return Promise.resolve(null);
  return fetch(BONE_DIR + f).then(r => r.json())
    .then(d => (detailCache[mesh] = d)).catch(() => null);
}

const VERT = `
attribute float aSel;
varying float vSel;
varying vec3 vN;
void main(){
  vSel = aSel;
  vN = normalMatrix * normal;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;
const FRAG = `
uniform vec3 uBone, uHover, uPick;
uniform float uFocus;
varying float vSel;
varying vec3 vN;
void main(){
  float a = vSel > 2.5 ? 0.0 : (vSel > 1.5 ? 1.0 : 1.0 - uFocus);
  if (a < 0.02) discard;
  vec3 base = vSel > 1.5 ? uPick : (vSel > 0.5 ? uHover : uBone);
  vec3 n = normalize(vN);
  float d = max(dot(n, normalize(vec3(0.30, 0.55, 0.78))), 0.0);
  float f = max(dot(n, normalize(vec3(-0.55, -0.25, -0.5))), 0.0);
  float rim = pow(1.0 - max(dot(n, vec3(0.0, 0.0, 1.0)), 0.0), 2.5);
  vec3 col = base * (0.40 + 0.62 * d) + base * 0.20 * f + vec3(0.10) * rim;
  gl_FragColor = vec4(col, a);
}`;

const DVERT = `
varying vec3 vN;
void main(){
  vN = normalMatrix * normal;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;
const DFRAG = `
uniform vec3 uPick;
varying vec3 vN;
void main(){
  vec3 n = normalize(vN);
  float d = max(dot(n, normalize(vec3(0.30, 0.55, 0.78))), 0.0);
  float f = max(dot(n, normalize(vec3(-0.55, -0.25, -0.5))), 0.0);
  float rim = pow(1.0 - max(dot(n, vec3(0.0, 0.0, 1.0)), 0.0), 2.5);
  gl_FragColor = vec4(uPick * (0.40 + 0.62 * d) + uPick * 0.20 * f + vec3(0.10) * rim, 1.0);
}`;

function startAtlas() {
  const host = $("#atlas"); if (!host) return;
  host.classList.add("busy");
  Promise.all([loadThree(), loadSkeleton()])
    .then(() => { host.classList.remove("busy"); buildAtlas(host); atlasUI(); })
    .catch(() => {
      host.classList.remove("busy");
      const m = $("#atlas-msg");
      if (m) m.textContent = "Не удалось загрузить модель — проверьте соединение.";
    });
}

function buildAtlas(host) {
  const msg = $("#atlas-msg"); if (msg) msg.remove();
  const dark = isDark();
  const W = host.clientWidth, H = host.clientHeight;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(W, H);
  host.insertBefore(renderer.domElement, host.firstChild);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(36, W / H, .01, 40);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(skel.pos, 3));
  geo.setAttribute("normal", new THREE.BufferAttribute(skel.nor, 3));
  geo.setAttribute("aSel", new THREE.BufferAttribute(skel.sel, 1));
  geo.setIndex(new THREE.BufferAttribute(skel.idx, 1));
  geo.computeBoundingBox(); geo.computeBoundingSphere();

  const mat = new THREE.ShaderMaterial({
    vertexShader: VERT, fragmentShader: FRAG, transparent: true,
    uniforms: {
      uBone:  { value: new THREE.Color(dark ? 0xa79a7e : 0xe0d4ba) },
      uHover: { value: new THREE.Color(dark ? 0xd8c9a6 : 0xfaf0d8) },
      uPick:  { value: new THREE.Color(dark ? 0xb8a982 : 0xd9c9a4) },
      uFocus: { value: 0 }
    }
  });
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);
  const dmat = new THREE.ShaderMaterial({
    vertexShader: DVERT, fragmentShader: DFRAG,
    uniforms: { uPick: { value: new THREE.Color(dark ? 0xb8a982 : 0xddcfab) } }
  });

  // расстояние, с которого габарит целиком попадает в кадр по обеим осям
  const fit = b => {
    const sz = b.getSize(new THREE.Vector3());
    const t = Math.tan(camera.fov * Math.PI / 360);
    return Math.max(sz.y / 2 / t, sz.x / 2 / t / camera.aspect, sz.z / 2 / t) * 1.14;
  };
  const box = geo.boundingBox.clone();
  const home = box.getCenter(new THREE.Vector3());
  const homeR = fit(box);

  // орбитальная камера: текущее значение догоняет целевое, отсюда плавные подлёты
  const cam = { th: 0, ph: .06, r: homeR, tgt: home.clone(),
                Th: 0, Ph: .06, R: homeR, Tgt: home.clone(), snap: true };
  const place = () => {
    const cp = Math.cos(cam.ph);
    camera.position.set(cam.tgt.x + cam.r * cp * Math.sin(cam.th),
                        cam.tgt.y + cam.r * Math.sin(cam.ph),
                        cam.tgt.z + cam.r * cp * Math.cos(cam.th));
    camera.lookAt(cam.tgt);
  };
  place();

  /* маркер выбранной структуры */
  const dot = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 16),
    new THREE.MeshBasicMaterial({ color: 0xb02a37 }));
  const halo = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 16),
    new THREE.MeshBasicMaterial({ color: 0xb02a37, transparent: true, opacity: .2 }));
  dot.visible = halo.visible = false;
  scene.add(dot, halo);

  let detail = null;           // подробная модель выбранной кости
  let hover = -1, drag = null, moved = 0, pinch = null;
  const ray = new THREE.Raycaster();
  const A = {
    picked: [],                // индексы частей в изоляции
    focusTo: 0,
    stop: null, select: null, focus: null, reset: null, hoverAt: null
  };

  const dropDetail = () => {
    if (!detail) return;
    scene.remove(detail); detail.geometry.dispose(); detail = null;
  };
  const setSel = (list, v) => {
    for (const pi of list) {
      const p = skel.meta.parts[pi];
      skel.sel.fill(v, p.vo, p.vo + p.nv);
    }
    geo.attributes.aSel.needsUpdate = true;
  };
  const partsOf = (names, side) => {
    const want = new Set(names);
    const one = names.length === 1;
    return skel.meta.parts.reduce((acc, p, i) => {
      if (want.has(p.n) && !(one && side && p.s && p.s !== side)) acc.push(i);
      return acc;
    }, []);
  };
  const boxOf = list => {
    const b = new THREE.Box3();
    const v = new THREE.Vector3();
    for (const pi of list) {
      const p = skel.meta.parts[pi];
      for (let i = p.vo; i < p.vo + p.nv; i++)
        b.expandByPoint(v.set(skel.pos[i * 3], skel.pos[i * 3 + 1], skel.pos[i * 3 + 2]));
    }
    return b;
  };

  A.select = (names, side) => {
    // у теменной и трапеции разметка есть только с одной стороны — берём её
    if (names.length === 1 && side && boneFiles) {
      const has = x => boneFiles[names[0] + (x ? "." + x : "")];
      const other = side === "r" ? "l" : "r";
      if (!has(side) && has(other)) { side = other; state.atlas.side = other; }
    }
    const list = partsOf(names, side);
    if (!list.length) return;
    skel.sel.fill(0);
    setSel(list, 2);
    hover = -1;
    A.picked = list;
    A.focusTo = 1;
    const b = boxOf(list);
    cam.Tgt = b.getCenter(new THREE.Vector3());
    cam.R = Math.max(fit(b), .04);
    dot.visible = halo.visible = false;
    dropDetail();
    // подробная модель — только когда выбрана одна кость
    if (names.length === 1) {
      const p = skel.meta.parts[list[0]];
      const key = p.n + (p.s ? "." + p.s : "");
      loadDetail(key).then(d => {
        if (!d || A.picked !== list) return;
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(d.positions, 3));
        g.setIndex(d.indices);
        g.computeVertexNormals();
        detail = new THREE.Mesh(g, dmat);
        detail.userData.labels = d.labels;
        scene.add(detail);
        setSel(list, 3);           // грубую версию убираем, её заменила подробная
        if (state.atlas.label) A.focus(state.atlas.label);
      });
    }
  };

  A.focus = name => {
    const labs = detail && detail.userData.labels;
    const m = labs && labs.find(l => l.n === name);
    if (!m) { dot.visible = halo.visible = false; return; }
    const p = new THREE.Vector3(m.p[0], m.p[1], m.p[2]);
    const b = boxOf(A.picked);
    const size = b.getSize(new THREE.Vector3()).length();
    const s = Math.max(size * .016, .0015);
    dot.position.copy(p); dot.scale.setScalar(s);
    halo.position.copy(p); halo.scale.setScalar(s * 1.9);
    dot.visible = halo.visible = true;
    // разворачиваем кость точкой к зрителю и подлетаем ближе
    const d = p.clone().sub(b.getCenter(new THREE.Vector3()));
    if (d.lengthSq() > 1e-9) {
      d.normalize();
      cam.Th = Math.atan2(d.x, d.z);
      cam.Ph = Math.max(-.9, Math.min(.9, Math.asin(d.y) * .55));
    }
    cam.Tgt = p.clone().lerp(b.getCenter(new THREE.Vector3()), .35);
    cam.R = Math.max(fit(b) * .72, .035);
  };

  A.reset = () => {
    skel.sel.fill(0);
    geo.attributes.aSel.needsUpdate = true;
    hover = -1;
    A.picked = []; A.focusTo = 0;
    dot.visible = halo.visible = false;
    dropDetail();
    cam.Tgt = home.clone(); cam.R = homeR; cam.Th = 0; cam.Ph = .06;
  };

  /* ── указатель: наведение подсвечивает, короткий тап выбирает ── */
  const tip = $("#atlas-tip");

  const hit = (cx, cy) => {
    const r = renderer.domElement.getBoundingClientRect();
    ray.setFromCamera(new THREE.Vector2(
      ((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1), camera);
    const h = ray.intersectObject(mesh, false)[0];
    if (!h) return -1;
    const t = h.faceIndex, tri = skel.tri;
    let lo = 0, hi = tri.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (tri[mid] <= t) lo = mid; else hi = mid - 1; }
    return lo;
  };
  const setHover = (pi, cx, cy) => {
    if (pi !== hover) {
      if (hover >= 0 && skel.sel[skel.meta.parts[hover].vo] === 1) setSel([hover], 0);
      hover = pi;
      if (pi >= 0 && skel.sel[skel.meta.parts[pi].vo] === 0) setSel([pi], 1);
    }
    if (pi >= 0 && tip) {
      const p = skel.meta.parts[pi], nm = BONE_NAMES[p.n];
      const r = host.getBoundingClientRect();
      tip.textContent = (nm ? nm[1] : p.n) + (p.s ? (p.s === "r" ? ", правая" : ", левая") : "");
      tip.style.left = (cx - r.left) + "px";
      tip.style.top = (cy - r.top) + "px";
      tip.classList.add("on");
    } else if (tip) tip.classList.remove("on");
  };

  const el = renderer.domElement;
  el.addEventListener("pointerdown", e => {
    drag = { x: e.clientX, y: e.clientY }; moved = 0;
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", e => {
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      moved += Math.abs(dx) + Math.abs(dy);
      cam.Th = cam.th -= dx * .008;
      cam.Ph = cam.ph = Math.max(-1.35, Math.min(1.35, cam.ph - dy * .008));
      drag = { x: e.clientX, y: e.clientY };
      if (tip) tip.classList.remove("on");
      return;
    }
    if (e.pointerType !== "mouse" || A.focusTo) return;
    const now = performance.now();
    if (now - (A.hoverAt || 0) < 80) return;
    A.hoverAt = now;
    setHover(hit(e.clientX, e.clientY), e.clientX, e.clientY);
  });
  el.addEventListener("pointerup", e => {
    const wasDrag = moved > 6;
    drag = null;
    if (wasDrag || A.focusTo) return;
    const pi = hit(e.clientX, e.clientY);
    if (pi < 0) return;
    const p = skel.meta.parts[pi];
    state.atlas = { bones: [p.n], side: p.s || "", label: null, term: null };
    A.select([p.n], p.s);
    if (tip) tip.classList.remove("on");
    atlasUI();
  });
  el.addEventListener("pointerleave", () => { if (tip) tip.classList.remove("on"); setHover(-1); });
  el.addEventListener("wheel", e => { e.preventDefault(); zoom(1 + e.deltaY * .0012); }, { passive: false });
  el.addEventListener("touchmove", e => {
    if (e.touches.length !== 2) return;
    drag = null;                       // двумя пальцами только масштабируем

    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY);
    if (pinch) zoom(pinch / d);
    pinch = d;
  }, { passive: true });
  el.addEventListener("touchend", () => { pinch = null; });
  function zoom(f) { cam.R = cam.r = Math.max(.03, Math.min(homeR * 1.6, cam.r * f)); }

  let alive = true, t0 = performance.now();
  (function loop() {
    if (!alive) return;
    requestAnimationFrame(loop);
    const e = .12;
    cam.th += (cam.Th - cam.th) * e;
    cam.ph += (cam.Ph - cam.ph) * e;
    cam.r  += (cam.R  - cam.r)  * e;
    cam.tgt.lerp(cam.Tgt, e);
    mat.uniforms.uFocus.value += (A.focusTo - mat.uniforms.uFocus.value) * .09;
    place();
    if (halo.visible) halo.scale.setScalar(dot.scale.x * (1.75 + Math.sin((performance.now() - t0) / 380) * .3));
    renderer.render(scene, camera);
  })();

  const onResize = () => {
    if (!alive || !host.clientWidth) return;
    camera.aspect = host.clientWidth / host.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(host.clientWidth, host.clientHeight);
    if (!A.picked.length) cam.R = fit(box);
  };
  addEventListener("resize", onResize);
  A.stop = () => {
    alive = false;
    removeEventListener("resize", onResize);
    if (detail) detail.geometry.dispose();
    geo.dispose(); mat.dispose(); dmat.dispose(); renderer.dispose();
  };

  AT = A;
  // восстанавливаем выбор, если на вкладку пришли из справочника
  if (state.atlas.bones) A.select(state.atlas.bones, state.atlas.side);
}

function stopAtlas() { if (AT) { AT.stop(); AT = null; } }

/* Термины, привязанные ровно к этой кости — они и составляют список структур */
function structsOf(bone) {
  return DATA.filter(t => {
    const l = TERM_3D[t.id]; if (!l) return false;
    const b = Array.isArray(l[0]) ? l[0] : [l[0]];
    return b.length === 1 && b[0] === bone;
  });
}

function renderAtlas() {
  if (!$("#atlas")) {
    $("#stage").innerHTML =
      '<div class="atlas" id="atlas">' +
        '<div class="stage-msg" id="atlas-msg">Загружаем скелет…</div>' +
        '<div class="atlas-top" id="atlas-top"></div>' +
        '<div class="atlas-foot"><span id="atlas-hint"></span>' +
          '<span class="credit">Z-Anatomy · BodyParts3D, CC BY-SA</span></div>' +
        '<div class="atlas-tip" id="atlas-tip"></div>' +
      "</div>";
    startAtlas();
  }
  atlasUI();
}

/* Оверлей и боковая панель: обновляются без пересборки сцены */
function atlasUI() {
  const a = state.atlas, top = $("#atlas-top"), hint = $("#atlas-hint");
  if (!top) return;
  const one = a.bones && a.bones.length === 1 ? a.bones[0] : null;
  const nm = one && BONE_NAMES[one];
  // в шапке — то, что сейчас рассматривают: структура, если выбрана, иначе кость
  const tt = a.term && BY_ID[a.term];
  const la = tt ? tt.la : (nm ? nm[0] : a.title);
  const ru = tt ? tt.tr + (nm ? " · " + nm[1] : "") : (nm ? nm[1] : a.title2);
  top.innerHTML = a.bones
    ? '<div class="atlas-card">' +
        (la ? '<div class="atlas-la">' + esc(la) + "</div>" : "") +
        '<div class="atlas-ru' + (la ? "" : " big") + '">' + esc(ru || "") +
        (one && a.side ? (a.side === "r" ? " · правая" : " · левая") : "") + "</div></div>" +
      '<button class="atlas-back" data-act="atlas-back">← весь скелет</button>'
    : "";
  if (hint) hint.textContent = a.bones
    ? "Потяните, чтобы повернуть · колесо или два пальца — масштаб"
    : "Нажмите кость, чтобы рассмотреть её отдельно";

  const side = $("#side");
  if (!side) return;
  if (!a.bones) {
    side.innerHTML = '<div><div class="side-h">Области</div><div class="sec-list">' +
      ATLAS_AREAS.map(([k, ru]) => '<button data-area="' + k + '">' + esc(ru) + "</button>").join("") +
      '</div></div><div class="side-note">Или нажмите любую кость прямо на модели — ' +
      'скелет уйдёт, останется она одна.</div>';
    return;
  }
  const back = "<div>";
  if (!one) {
    // выбрана область — даём выбрать в ней кость
    const seen = [];
    a.bones.forEach(b => { if (!seen.includes(b)) seen.push(b); });
    side.innerHTML = back +
      '<div class="side-h" style="margin-top:10px">Кости области</div><div class="struct-list">' +
      seen.map(b => {
        const n = BONE_NAMES[b];
        return '<button data-bone="' + esc(b) + '"><span class="sl">' + esc(n ? n[0] : b) +
          '</span><span class="sr">' + esc(n ? n[1] : "") + "</span></button>";
      }).join("") + "</div></div>";
    return;
  }
  const list = structsOf(one);
  side.innerHTML = back +
    (list.length
      ? '<div class="side-h" style="margin-top:10px">Структуры</div><div class="struct-list">' +
        list.map(t => {
          const lab = TERM_3D[t.id][1];
          return '<button data-struct="' + t.id + '" aria-current="' + (a.term === t.id) + '">' +
            '<span class="sl">' + esc(t.la) + "</span>" +
            '<span class="sr' + (lab ? "" : " nodot") + '">' + esc(t.tr) +
            (lab ? "" : " · не размечена") + "</span></button>";
        }).join("") + "</div>"
      : '<div class="side-note" style="margin-top:10px">Для этой кости в базе пока нет терминов.</div>') +
    "</div>";
}

const ATLAS_AREAS = [
  ["cranium", "Череп"], ["spineAll", "Позвоночник"],
  ["thoraxAll", "Грудная клетка"], ["shoulderG", "Пояс верхней конечности"],
  ["armG", "Рука"], ["pelvisG", "Таз"], ["legG", "Нога"]
];
function areaBones(k) {
  if (k === "thoraxAll") return G.ribsTrue.concat(G.ribsFalse, G.sternum);
  if (k === "shoulderG") return ["Clavicle", "Scapula"];
  if (k === "armG") return ["Humerus", "Radius", "Ulna"].concat(G.carpus, G.metacarpus, G.phalHand);
  if (k === "pelvisG") return ["Hip bone", "Sacrum", "Coccyx"];
  if (k === "legG") return ["Femur", "Patella", "Tibia", "Fibula"].concat(G.tarsus, G.metatarsus, G.phalFoot);
  return G[k];
}

/* Переход из справочника: открыть вкладку и сразу навести на структуру */
function showOnSkeleton(t) {
  const link = TERM_3D[t.id]; if (!link) return;
  const bones = Array.isArray(link[0]) ? link[0] : [link[0]];
  state.atlas = { bones, side: "r", label: link[1], term: t.id,
                  title: t.la, title2: t.tr };
  state.view = "atlas";
  render();
  if (AT) { AT.select(bones, "r"); atlasUI(); }
}

/* ── события ───────────────────────────────────────── */
function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === state.view));
  const mainEl = document.querySelector("main");
  if (state.view !== "atlas") stopAtlas();
  mainEl.classList.toggle("atlas-on", state.view === "atlas");
  if (state.view === "atlas") { renderAtlas(); return; }   // атлас сам рисует обе колонки
  renderSide();
  if (state.view === "ref") renderRef();
  else if (state.view === "drill") renderDrill();
  else renderRules();
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-v],[data-sec],[data-grp],[data-mode],[data-opt],[data-syl],[data-act],[data-area],[data-struct],[data-bone]");
  if (!el) return;
  const art = e.target.closest(".term"), t = art ? BY_ID[art.dataset.id] : null;
  if (el.dataset.v) { state.view = el.dataset.v; if (state.view === "drill" && !state.cur) nextCard(true); render(); return; }
  if (el.dataset.grp) {
    const cur = state.view === "drill" ? state.scope : state.sec;
    const home = (SECTIONS.find(s => s[0] === cur) || [])[3] || null;
    const open = state.grp === null ? home : state.grp;
    state.grp = open === el.dataset.grp ? "" : el.dataset.grp;
    renderSide(); return;
  }
  if (el.dataset.sec) {
    state.grp = (SECTIONS.find(s => s[0] === el.dataset.sec) || [])[3] || "";
    if (state.view === "drill") { state.scope = el.dataset.sec; state.cur = null; nextCard(true); }
    else { state.sec = el.dataset.sec; state.q = ""; $("#q").value = ""; }
    render(); return;
  }
  if (el.dataset.mode) { state.mode = el.dataset.mode; state.cur = null; nextCard(true); render(); return; }
  if (el.dataset.area) {
    const bones = areaBones(el.dataset.area);
    state.atlas = { bones, side: "r", label: null, term: null,
                    title: "", title2: el.textContent };
    if (AT) AT.select(bones, "r");
    atlasUI(); return;
  }
  if (el.dataset.bone) {
    const b = el.dataset.bone;
    state.atlas = { bones: [b], side: state.atlas.side || "r", label: null, term: null };
    if (AT) AT.select([b], state.atlas.side);
    atlasUI(); return;
  }
  if (el.dataset.struct) {
    const t2 = BY_ID[el.dataset.struct], link = TERM_3D[t2.id];
    state.atlas.term = t2.id;
    state.atlas.label = link[1];
    if (AT && link[1]) AT.focus(link[1]);
    atlasUI();
    say(t2);                 // нажал название — сразу слышит, как оно звучит
    return;
  }
  if (el.dataset.opt) { if (!state.answered) answer(el.dataset.opt === state.cur.id, el.dataset.opt); return; }
  if (el.dataset.syl != null) {
    if (state.answered) return;
    const i = +el.dataset.syl, ok = state.cur.syls[i].stress;
    el.classList.add(ok ? "right" : "wrong");
    answer(ok, i); return;
  }
  switch (el.dataset.act) {
    case "open": state.open = state.open === t.id ? null : t.id; render(); break;
    case "say": say(t); break;
    case "say-slow": say(t || state.cur, true); break;
    case "say-cur": say(state.cur); break;
    case "say-cur-slow": say(state.cur, true); break;
    case "next": nextCard(); render(); break;
    case "show3d": showOnSkeleton(t); break;
    case "atlas-back":
      state.atlas = { bones: null, side: "r", label: null, term: null };
      if (AT) AT.reset();
      atlasUI(); break;
    case "rec": toggleRec(t, el); break;
    case "unrec": dropRec(t); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.view === "atlas" && state.atlas.bones) {
    state.atlas = { bones: null, side: "r", label: null, term: null };
    if (AT) AT.reset();
    atlasUI(); return;
  }
  if (state.view !== "drill" || e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (state.answered && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); nextCard(); render(); return; }
  if (!state.answered && state.opts && /^[1-4]$/.test(e.key)) {
    const x = state.opts[+e.key - 1]; if (x) answer(x.id === state.cur.id, x.id);
  }
});
$("#q").addEventListener("input", e => { state.q = e.target.value; if (state.view !== "ref") state.view = "ref"; render(); });
render();
</script>
